# Central Stonecutter properties for Return my gold farm.
# Top-level keys apply to every node; [<loader>."<version>"] sections apply to that node only.
# Build scripts read these via property("...") after calling properties.tags(version, loader).

mod_id = "return-my-gold-farm"
mod_version = "2.0.0"
# Label used in jar file names; each jar covers the whole 26.1-26.2 range.
display_mc = "26.1-26.2"

# ---------------------------------------------------------------------------
# Fabric: built against the latest stable MC (26.2), runs on 26.1-26.2.
# 26.1+ ships Mojang-mapped, so the node builds deobfuscated via build.fabric.gradle.kts.
#   loader  https://fabricmc.net/develop/
# ---------------------------------------------------------------------------

[fabric."26.2"]
minecraft_version = "26.2"
loader_version = "0.19.3"
supported_minecraft_version = ">=26.1- <26.3"
display_name = "[26.1-26.2]"
supported_versions = "26.1,26.1.1,26.1.2,26.2"

# ---------------------------------------------------------------------------
# NeoForge: built against stable 26.1 (26.2 only has beta builds). The open NeoForge dependency
# range lets the jar load on 26.2 servers too. build.neoforge.gradle.kts: ModDevGradle.
#   neoforge_version  https://projects.neoforged.net/neoforged/neoforge
# ---------------------------------------------------------------------------

[neoforge."26.1"]
minecraft_version = "26.1"
neoforge_version = "26.1.2.76"
supported_minecraft_version = "[26.1,26.3)"
display_name = "[26.1-26.2]"
supported_versions = "26.1,26.1.1,26.1.2,26.2"
